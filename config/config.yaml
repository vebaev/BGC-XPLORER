samples: "config/samples.tsv"

bakta_dir: "data/bakta"
results_dir: "results"

execution:
  mode: "local"
  work_root: "/work"
  host_db_root: "/db"
  container_db_root: "/db"
  reuse_existing_outputs: true

bakta_extensions:
  gbff: ".gbff"
  fna: ".fna"
  faa: ".faa"
  gff3: ".gff3"
  json: ".json"
  tsv: ".tsv"

tools:
  antismash:
    extra_args: "--databases /db/antismash"
    container: "antismash/standalone-lite:8.0.4"
    db_subdir: "antismash"
    executable: "/opt/conda/envs/antismash/bin/antismash"
  gecco:
    extra_args: ""
    container: "aktino/gecco:latest"
    executable: "/opt/conda/envs/gecco/bin/gecco"
  deepbgc:
    extra_args: "--prodigal-meta-mode"
    container: "aktino/deepbgc:latest"
    db_subdir: "deepbgc"
    executable: "/opt/conda/envs/deepbgc/bin/deepbgc"
  arts:
    extra_args: ""
    reference_set: "actinobacteria"
    antismash_as_input: true
    container: "ziemertlab/arts-beta:3.0.b2"
    ref_subdir: "arts"
    python: "/opt/conda/envs/arts/bin/python"
    script: "/opt/arts/artspipeline1.py"
  eggnog:
    extra_args: ""
    search_mode: "diamond"
    container: "aktino/eggnog:latest"
    db_subdir: "eggnog"
    executable: "/opt/conda/envs/eggnog/bin/emapper.py"
  dbcan:
    extra_args: ""
    container: "aktino/dbcan:latest"
    db_subdir: "dbcan"
    binary: "/opt/conda/envs/dbcan/bin/run_dbcan"
    hmmer_bin_dir: "/opt/conda/envs/dbcan/bin"

consensus:
  overlap_fraction: 0.5
  score_weights:
    tool_support: 1.0
    tool_pair_bonus: 1.5
    tool_triple_bonus: 3.0
    single_tool_penalty: 2.5
    arts_signal: 0.75
    arts_signal_cap: 4.0
    shared_core_gene_bonus: 1.5
    novelty_score: 3.0
    boundary_high: 1.5
    boundary_medium: 0.5
    antibacterial_bonus: 1.5
    cytotoxic_bonus: 1.0
    edge_penalty: 1.5
  high_confidence_thresholds:
    gecco: 0.7
    deepbgc: 0.7
  dereplication_thresholds:
    known_like: 80.0
    related: 50.0
    divergent: 20.0
  edge_threshold_bp: 5000
  priority_thresholds:
    high: 12.0
    medium: 7.0

report:
  title: "BGC-XPLORER"
  ai:
    enabled: true
    endpoint: "/analyze_cluster"
