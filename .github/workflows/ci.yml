name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI dependencies
        run: python -m pip install pyyaml
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check public source boundary
        run: git ls-files -z | xargs -0 python scripts/check_public_tree.py
      - name: Validate production Compose
        env:
          NVIDIA_API_KEY: validation-only
        run: docker compose config --quiet
      - name: Validate development Compose
        env:
          NVIDIA_API_KEY: validation-only
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  build-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: bgc-xplorer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
