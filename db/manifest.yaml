bakta_light:
  required: false
  host_path: "db/bakta/db-light"
  status: "selected-by-environment"
  notes: "Used when BAKTA_DB_TYPE=light; downloaded once and never auto-updated."
  source: "https://github.com/oschwengers/bakta"
  required_files:
    - "version.json"
    - "bakta.db"
    - "pscc.dmnd"

bakta_full:
  required: false
  host_path: "db/bakta/db"
  status: "selected-by-environment"
  notes: "Used when BAKTA_DB_TYPE=full; downloaded once and never auto-updated."
  source: "https://github.com/oschwengers/bakta"
  required_files:
    - "version.json"
    - "bakta.db"
    - "psc.dmnd"

antismash:
  required: true
  host_path: "db/antismash"
  status: "managed"
  notes: "Downloaded automatically with the official antiSMASH 8.0.4 database helper when missing."
  source: "https://docs.antismash.secondarymetabolites.org/install/"
  required_files:
    - "pfam/35.0/Pfam-A.hmm"
    - "clusterblast/clusters.txt"
    - "knownclusterblast/4.0/clusters.txt"
    - "knownclusterblast/4.0/proteins.dmnd"
    - "clustercompare/mibig/4.0/data.json"

deepbgc:
  required: true
  host_path: "db/deepbgc"
  status: "managed"
  notes: "Downloaded automatically with the DeepBGC 0.1.31 downloader when missing."
  source: "https://github.com/Merck/deepbgc"
  required_files:
    - "0.1.0/detector/deepbgc.pkl"
    - "0.1.0/classifier/product_class.pkl"
    - "common/Pfam-A.31.0.hmm"
    - "common/Pfam-A.31.0.hmm.h3i"

arts:
  required: true
  host_path: "db/arts"
  status: "managed"
  notes: "Actinobacteria is installed automatically from the ARTS source revision bundled in the image."
  source: "https://github.com/ZiemertLab/ARTS"
  required_files:
    - "actinobacteria/coremodels.hmm"
    - "actinobacteria/model_metadata.json"
    - "actinobacteria/genematrix.txt"
    - "knownresistance.hmm"
    - "dufmodels.hmm"
    - ".bgc-xplorer-actinobacteria.ready"

gecco:
  required: false
  host_path: ""
  status: "n/a"
  notes: "No separate database directory assumed by this workflow."
  source: "https://github.com/zellerlab/GECCO"

eggnog:
  required: true
  host_path: "db/eggnog"
  status: "managed"
  notes: "Downloaded automatically with the eggNOG-mapper 2.1.13 downloader when missing."
  source: "https://github.com/eggnogdb/eggnog-mapper"
  required_files:
    - "eggnog.db"
    - "eggnog_proteins.dmnd"
    - "eggnog.taxa.db"

mibig:
  required: false
  host_path: "db/mibig"
  status: "managed"
  notes: "MIBiG 4.0 JSON entries for the AI summary of the closest known cluster; downloaded automatically (about 1 MB), checksum-verified."
  source: "https://dl.secondarymetabolites.org/mibig/mibig_json_4.0.tar.gz"
  required_files:
    - "mibig_json_4.0.tar.gz"
    - "mibig_json_4.0/BGC0000001.json"

dbcan:
  required: false
  host_path: "db/dbcan"
  status: "optional"
  notes: "Optional dbCAN v5 resource; the current workflow can start without it."
  source: "https://github.com/linnabrown/run_dbcan"
  required_files:
    - "dbCAN.hmm"
    - "dbCAN-sub.hmm"
    - "CAZy.dmnd"
